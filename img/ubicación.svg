<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa ilustrado de Mottled Cream</title>
  <desc id="desc">Mapa decorativo en tonos crema, café y salvia con un marcador de ubicación para Mottled Cream. No representa calles ni una dirección real.</desc>
  <defs>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1" fill="#BAA586" opacity=".18"/><circle cx="25" cy="22" r="1.2" fill="#BAA586" opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#665034" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="#F2ECE4"/>
  <rect width="1200" height="720" rx="34" fill="url(#grain)"/>
  <!-- bloques y jardines -->
  <g stroke="#D8C9B5" stroke-width="3">
    <path d="M0 0H1200V720H0Z" fill="none"/>
    <rect x="48" y="55" width="250" height="155" rx="22" fill="#E8DCCB"/>
    <rect x="340" y="45" width="250" height="185" rx="22" fill="#E5D8C5"/>
    <rect x="635" y="55" width="205" height="145" rx="22" fill="#E9DFD1"/>
    <rect x="895" y="48" width="255" height="170" rx="22" fill="#E7D9C7"/>
    <rect x="55" y="285" width="230" height="155" rx="22" fill="#E7DDCE"/>
    <rect x="350" y="300" width="205" height="150" rx="22" fill="#DDE2D2"/>
    <rect x="900" y="285" width="245" height="155" rx="22" fill="#DDE2D2"/>
    <rect x="50" y="510" width="260" height="155" rx="22" fill="#E7D9C7"/>
    <rect x="360" y="510" width="235" height="150" rx="22" fill="#E8DCCB"/>
    <rect x="650" y="505" width="210" height="160" rx="22" fill="#E2DCCF"/>
    <rect x="910" y="510" width="245" height="155" rx="22" fill="#E8DCCB"/>
  </g>
  <!-- calles -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 250H1200M0 475H1200" stroke="#FFFCF7" stroke-width="58"/>
    <path d="M315 0V720M610 0V720M870 0V720" stroke="#FFFCF7" stroke-width="58"/>
    <path d="M0 250H1200M0 475H1200M315 0V720M610 0V720M870 0V720" stroke="#C8B79F" stroke-width="2.5" stroke-dasharray="10 13" opacity=".75"/>
  </g>
  <!-- parque -->
  <g>
    <path d="M690 315c35-32 100-29 130 8 28 35 12 82-24 99-38 18-98 6-117-29-13-24-8-57 11-78Z" fill="#C8D1BC" stroke="#9AA889" stroke-width="3"/>
    <path d="M730 355c14-18 31-18 43-4 10 13 6 30-8 38-17 10-39-3-35-22Z" fill="#A8B596"/>
    <g fill="#65745A"><circle cx="710" cy="342" r="8"/><circle cx="790" cy="340" r="9"/><circle cx="770" cy="397" r="7"/><circle cx="715" cy="402" r="6"/></g>
    <text x="752" y="438" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#65745A">Jardín</text>
  </g>
  <!-- pequeños edificios -->
  <g fill="#BAA586" opacity=".8"><rect x="90" y="92" width="58" height="40" rx="6"/><rect x="165" y="92" width="90" height="40" rx="6"/><rect x="385" y="88" width="72" height="52" rx="6"/><rect x="475" y="88" width="75" height="52" rx="6"/><rect x="935" y="88" width="75" height="42" rx="6"/><rect x="1025" y="88" width="85" height="42" rx="6"/><rect x="95" y="555" width="75" height="48" rx="6"/><rect x="190" y="555" width="80" height="48" rx="6"/></g>
  <!-- pin central -->
  <g filter="url(#shadow)" transform="translate(610 350)">
    <path d="M0 112C-18 82-78 23-78-22a78 78 0 1 1 156 0c0 45-60 104-78 134Z" fill="#8E3F52" stroke="#FFFCF7" stroke-width="8"/>
    <circle cy="-22" r="31" fill="#FFFCF7"/>
    <path d="M-17-24h34v25h-34z" fill="#BAA586" rx="4"/><path d="M-21-24 0-40l21 16" fill="none" stroke="#706250" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7-5v-12h14v12" fill="none" stroke="#706250" stroke-width="4"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="280" width="285" height="82" rx="18" fill="#FFFCF7" stroke="#8E3F52" stroke-width="2.5"/>
    <text x="728" y="315" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#665034">Mottled Cream</text>
    <text x="728" y="342" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.4" fill="#8E3F52">CAFÉ · PANADERÍA · REPOSTERÍA</text>
  </g>
  <!-- brújula y leyenda -->
  <g transform="translate(1090 570)"><circle r="35" fill="#FFFCF7" stroke="#BAA586" stroke-width="2"/><path d="M0-23 8 4 0 0-8 4Z" fill="#8E3F52"/><text x="0" y="-42" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#665034">N</text></g>
  <text x="52" y="695" font-family="Arial,sans-serif" font-size="14" letter-spacing="1.6" fill="#8B7963">MAPA ILUSTRATIVO · DISEÑO DECORATIVO</text>
</svg>
